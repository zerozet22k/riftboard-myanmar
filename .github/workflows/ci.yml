name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Schema, tests, and lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed environment schema
        run: |
          git ls-files --error-unmatch .env.example
          npm run env:check:ci

      - name: Test environment pipeline
        run: npm run test:env

      - name: Test Riot identity scopes
        run: npm run test:riot-identity

      - name: Type-check web app
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Set up .NET
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build refresh tray
        if: runner.os == 'Windows'
        run: dotnet build local-refresh-agent/src/RiftBoardRefreshTray/RiftBoardRefreshTray.csproj -c Release

      - name: Test refresh tray
        if: runner.os == 'Windows'
        run: dotnet run --project local-refresh-agent/tests/RiftBoardRefreshTray.SmokeTests/RiftBoardRefreshTray.SmokeTests.csproj -c Release
